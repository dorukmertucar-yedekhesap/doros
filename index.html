<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DorOs ROMs | dorukmertucar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #050505; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        h1 { margin-bottom: 40px; font-size: 2.5rem; letter-spacing: -1px; }
        
        .carousel-container { width: 100%; max-width: 900px; position: relative; display: flex; align-items: center; }
        
        .rom-slider {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 20px;
            padding: 20px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .rom-slider::-webkit-scrollbar { display: none; }

        .rom-card {
            min-width: 280px;
            background: #111;
            border: 1px solid #222;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }
        .rom-card:hover { border-color: #444; }
        .rom-card h2 { margin-bottom: 15px; color: #00d4ff; }
        
        .btn-download {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .nav-btn {
            background: #222;
            color: #fff;
            border: none;
            padding: 15px;
            cursor: pointer;
            border-radius: 50%;
            margin: 0 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>DorOs Projeleri</h1>

    <div class="carousel-container">
        <button class="nav-btn" onclick="document.getElementById('slider').scrollBy(-300, 0)">&#10094;</button>
        
        <div class="rom-slider" id="slider">
            <div class="rom-card">
                <h2>DorOs 4.0 Beta</h2>
                <a href="#" class="btn-download">İndir</a>
            </div>
            <div class="rom-card">
                <h2>DorOs 5.1.1</h2>
                <a href="#" class="btn-download">İndir</a>
            </div>
            <div class="rom-card">
                <h2>DorOs 4.3.1</h2>
                <a href="#" class="btn-download">İndir</a>
            </div>
            <div class="rom-card">
                <h2>DorOs S5 Port</h2>
                <a href="#" class="btn-download">İndir</a>
            </div>
        </div>

        <button class="nav-btn" onclick="document.getElementById('slider').scrollBy(300, 0)">&#10095;</button>
    </div>

</body>
</html>
